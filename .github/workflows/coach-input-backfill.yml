name: Generate coach inputs from R2

on:
  schedule:
    - cron: "40 2,8,14,20 * * *"  # after the normal Garmin/R2 jobs
  workflow_run:
    workflows:
      - Refresh fitness data
      - Refresh changed Garmin activities
      - Scheduled Garmin activity backfill
      - Backfill granular Garmin activities
    types: [completed]
  workflow_dispatch:
    inputs:
      max_activities:
        description: "Maximum missing running analyses to generate (1-50)"
        required: true
        default: "50"
        type: string

permissions:
  contents: read

concurrency:
  group: coach-input-r2
  cancel-in-progress: false

jobs:
  backfill:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: slipstream-data
      R2_MAX_BUCKET_BYTES: "5368709120"
      R2_MAX_BUCKET_OBJECTS: "100000"
      R2_MAX_WRITES_PER_RUN: "60"
      R2_MAX_WRITE_BYTES_PER_RUN: "67108864"
      MAX_ACTIVITIES: ${{ inputs.max_activities || '50' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate bounded missing coach inputs from existing R2 artifacts
        run: python -m pipeline.coach_backfill --max-activities "$MAX_ACTIVITIES"
