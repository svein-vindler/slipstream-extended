name: Refresh fitness data

# Pulls your latest Garmin data on a schedule and on-demand. Existing summaries
# are restored from private R2, merged incrementally, and uploaded back to R2.
on:
  schedule:
    - cron: "0 */6 * * *"      # every 6 hours
  workflow_dispatch:
    inputs:
      health_start:
        description: "Optional health backfill start (YYYY-MM-DD)"
        required: false
        type: string
      health_end:
        description: "Optional health backfill end (YYYY-MM-DD)"
        required: false
        type: string
      backfill_start_year:
        description: "Optional first year in a multi-year health backfill"
        required: false
        type: string
      backfill_end_year:
        description: "Optional last year; processed first, then backwards"
        required: false
        type: string
      include_granular:
        description: "Also refresh recent detailed HRV and activity artifacts"
        required: false
        default: false
        type: boolean
      latest_activity_only:
        description: "Import only the latest recent Garmin activity, its files and Coach Input"
        required: false
        default: false
        type: boolean
      latest_night_only:
        description: "Import sleep and HRV for one recent wake-date only"
        required: false
        default: false
        type: boolean
      latest_wake_date:
        description: "Garmin wake-date (YYYY-MM-DD)"
        required: false
        type: string
      sync_request_id:
        description: "Correlation ID for the fresh-data request"
        required: false
        type: string
      latest_r2_only:
        description: "Repair one running Coach Input from canonical R2 only"
        required: false
        default: false
        type: boolean
      latest_activity_id:
        description: "Optional numeric Garmin activity ID within the recent window"
        required: false
        type: string
      latest_new_activity_expected:
        description: "Report no new workout instead of re-importing a complete older one"
        required: false
        default: true
        type: boolean
      latest_expected_date:
        description: "Optional Garmin-local date of the expected workout (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Shared with granular jobs so Garmin is never queried concurrently.
  group: garmin-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GARMINTOKENS: ${{ secrets.GARMINTOKENS }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: slipstream-data
      R2_MAX_BUCKET_BYTES: "5368709120"       # 5 GiB, half the free allowance
      R2_MAX_BUCKET_OBJECTS: "100000"
      R2_MAX_WRITES_PER_RUN: "250"
      R2_MAX_WRITE_BYTES_PER_RUN: "536870912" # 512 MiB
      HEALTH_START: ${{ inputs.health_start }}
      HEALTH_END: ${{ inputs.health_end }}
      BACKFILL_START_YEAR: ${{ inputs.backfill_start_year }}
      BACKFILL_END_YEAR: ${{ inputs.backfill_end_year }}
      SYNC_REQUEST_ID: ${{ inputs.sync_request_id }}
      LATEST_WAKE_DATE: ${{ inputs.latest_wake_date }}
      LATEST_R2_ONLY: ${{ inputs.latest_r2_only }}
      LATEST_ACTIVITY_ID: ${{ inputs.latest_activity_id }}
      LATEST_NEW_ACTIVITY_EXPECTED: ${{ inputs.latest_new_activity_expected }}
      LATEST_EXPECTED_DATE: ${{ inputs.latest_expected_date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the shared bounded refresh pipeline
        env:
          REFRESH_EVENT: ${{ github.event_name }}
          ACTIVITY_ONLY: ${{ inputs.latest_activity_only }}
          NIGHT_ONLY: ${{ inputs.latest_night_only }}
          INCLUDE_GRANULAR: ${{ inputs.include_granular }}
        run: python -m pipeline.refresh --workflow
