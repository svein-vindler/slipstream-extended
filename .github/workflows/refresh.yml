name: Refresh fitness data

# Pulls your latest Garmin data on a schedule and on-demand. Existing summaries
# are restored from private R2, merged incrementally, and uploaded back to R2.
on:
  schedule:
    - cron: "0 */6 * * *"      # every 6 hours
  workflow_dispatch:
    inputs:
      health_start:
        description: "Optional health backfill start (YYYY-MM-DD)"
        required: false
        type: string
      health_end:
        description: "Optional health backfill end (YYYY-MM-DD)"
        required: false
        type: string
      backfill_start_year:
        description: "Optional first year in a multi-year health backfill"
        required: false
        type: string
      backfill_end_year:
        description: "Optional last year; processed first, then backwards"
        required: false
        type: string
      include_granular:
        description: "Also refresh recent detailed HRV and activity artifacts"
        required: false
        default: false
        type: boolean
      latest_activity_only:
        description: "Import only the latest recent Garmin activity, its files and Coach Input"
        required: false
        default: false
        type: boolean
      latest_night_only:
        description: "Import sleep and HRV for one recent wake-date only"
        required: false
        default: false
        type: boolean
      latest_wake_date:
        description: "Garmin wake-date (YYYY-MM-DD)"
        required: false
        type: string
      sync_request_id:
        description: "Correlation ID for the fresh-data request"
        required: false
        type: string
      latest_r2_only:
        description: "Repair one running Coach Input from canonical R2 only"
        required: false
        default: false
        type: boolean
      latest_activity_id:
        description: "Optional numeric Garmin activity ID within the recent window"
        required: false
        type: string
      latest_new_activity_expected:
        description: "Report no new workout instead of re-importing a complete older one"
        required: false
        default: true
        type: boolean
      latest_expected_date:
        description: "Optional Garmin-local date of the expected workout (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Shared with granular jobs so Garmin is never queried concurrently.
  group: garmin-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      DAYS_BACK: "30"          # refresh window; older rows are preserved
      HEALTH_DAYS_BACK: "14"   # recent health can settle for several days
      GARMINTOKENS: ${{ secrets.GARMINTOKENS }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: slipstream-data
      R2_MAX_BUCKET_BYTES: "5368709120"       # 5 GiB, half the free allowance
      R2_MAX_BUCKET_OBJECTS: "100000"
      R2_MAX_WRITES_PER_RUN: "250"
      R2_MAX_WRITE_BYTES_PER_RUN: "536870912" # 512 MiB
      HEALTH_START: ${{ inputs.health_start }}
      HEALTH_END: ${{ inputs.health_end }}
      BACKFILL_START_YEAR: ${{ inputs.backfill_start_year }}
      BACKFILL_END_YEAR: ${{ inputs.backfill_end_year }}
      SYNC_REQUEST_ID: ${{ inputs.sync_request_id }}
      LATEST_WAKE_DATE: ${{ inputs.latest_wake_date }}
      LATEST_R2_ONLY: ${{ inputs.latest_r2_only }}
      LATEST_ACTIVITY_ID: ${{ inputs.latest_activity_id }}
      LATEST_NEW_ACTIVITY_EXPECTED: ${{ inputs.latest_new_activity_expected }}
      LATEST_EXPECTED_DATE: ${{ inputs.latest_expected_date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate targeted modes
        env:
          ACTIVITY_ONLY: ${{ inputs.latest_activity_only }}
          NIGHT_ONLY: ${{ inputs.latest_night_only }}
          R2_ONLY: ${{ inputs.latest_r2_only }}
        run: |
          if [[ "$ACTIVITY_ONLY" == "true" && "$NIGHT_ONLY" == "true" ]]; then
            echo "Choose one targeted mode."
            exit 2
          fi
          if [[ "$R2_ONLY" == "true" && "$ACTIVITY_ONLY" != "true" ]]; then
            echo "R2-only repair requires targeted activity mode."
            exit 2
          fi
      - name: Restore current summaries from private R2
        if: ${{ !inputs.latest_night_only && !inputs.latest_r2_only }}
        run: python -m pipeline.summary_restore --data-dir data
      - name: Remember activities already stored before an on-demand refresh
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_granular && !inputs.latest_activity_only && !inputs.latest_night_only }}
        run: |
          python -m pipeline.manual_activity_refresh snapshot \
            --summary data/activities.csv --output .granular/on-demand-baseline.json
      - name: Fetch + write data/
        if: ${{ github.event_name == 'schedule' || !inputs.latest_activity_only && !inputs.latest_night_only }}
        run: |
          if [ -n "$BACKFILL_START_YEAR" ] || [ -n "$BACKFILL_END_YEAR" ]; then
            if [ -z "$BACKFILL_START_YEAR" ] || [ -z "$BACKFILL_END_YEAR" ]; then
              echo "Both backfill_start_year and backfill_end_year are required."
              exit 2
            fi
            if [ -n "$HEALTH_START" ] || [ -n "$HEALTH_END" ]; then
              echo "Use either year inputs or date inputs, not both."
              exit 2
            fi
            if ! [[ "$BACKFILL_START_YEAR" =~ ^[0-9]{4}$ && "$BACKFILL_END_YEAR" =~ ^[0-9]{4}$ ]]; then
              echo "Backfill years must contain four digits."
              exit 2
            fi
            if [ "$BACKFILL_START_YEAR" -gt "$BACKFILL_END_YEAR" ]; then
              echo "backfill_start_year cannot be after backfill_end_year."
              exit 2
            fi
            for ((year=BACKFILL_END_YEAR; year>=BACKFILL_START_YEAR; year--)); do
              echo "Fetching health summaries for $year"
              python -m pipeline.fetch --skip-activities \
                --health-start "$year-01-01" --health-end "$year-12-31"
            done
          elif [ -n "$HEALTH_START" ] || [ -n "$HEALTH_END" ]; then
            if [ -z "$HEALTH_START" ] || [ -z "$HEALTH_END" ]; then
              echo "Both health_start and health_end are required for a backfill."
              exit 2
            fi
            python -m pipeline.fetch --skip-activities \
              --health-start "$HEALTH_START" --health-end "$HEALTH_END"
          else
            python -m pipeline.fetch --days "$DAYS_BACK" \
              --health-days "$HEALTH_DAYS_BACK"
          fi
      - name: Upload summaries and daily snapshot to private R2
        if: ${{ github.event_name == 'schedule' || !inputs.latest_activity_only && !inputs.latest_night_only }}
        run: python -m pipeline.summary_export --data-dir data
      - name: Refresh recent detailed sleep and HRV
        if: ${{ github.event_name == 'schedule' || !inputs.latest_activity_only && !inputs.latest_night_only }}
        run: python -m pipeline.recent_health --days 3
      - name: Refresh recent body composition
        if: ${{ github.event_name == 'schedule' || !inputs.latest_activity_only && !inputs.latest_night_only }}
        run: python -m pipeline.recent_body --max-days 3 --summary data/health_daily.csv
      - name: Import newly discovered workouts and missing recent files
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_granular && !inputs.latest_activity_only && !inputs.latest_night_only }}
        run: |
          python -m pipeline.manual_activity_refresh process \
            --baseline .granular/on-demand-baseline.json \
            --summary data/activities.csv \
            --run-id "$GITHUB_RUN_ID"
      - name: Import one recent activity and its coach input
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.latest_activity_only }}
        run: |
          args=(--run-id "$GITHUB_RUN_ID" --data-dir data --lookback-days 7)
          if [[ -n "$SYNC_REQUEST_ID" ]]; then args+=(--request-id "$SYNC_REQUEST_ID"); fi
          if [[ "$LATEST_R2_ONLY" == "true" ]]; then args+=(--repair-only); fi
          if [[ "$LATEST_NEW_ACTIVITY_EXPECTED" == "false" ]]; then
            args+=(--new-activity-expected false)
          fi
          if [[ -n "$LATEST_EXPECTED_DATE" ]]; then
            if ! [[ "$LATEST_EXPECTED_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "latest_expected_date must use YYYY-MM-DD."
              exit 2
            fi
            args+=(--expected-date "$LATEST_EXPECTED_DATE")
          fi
          if [[ -n "$LATEST_ACTIVITY_ID" ]]; then
            if ! [[ "$LATEST_ACTIVITY_ID" =~ ^[0-9]{1,20}$ ]]; then
              echo "latest_activity_id must be a numeric Garmin ID."
              exit 2
            fi
            args+=(--activity-id "$LATEST_ACTIVITY_ID")
          fi
          python -m pipeline.latest_activity "${args[@]}"
      - name: Import one recent night
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.latest_night_only }}
        run: |
          args=(--run-id "$GITHUB_RUN_ID" --wake-date "$LATEST_WAKE_DATE")
          if [[ -n "$SYNC_REQUEST_ID" ]]; then args+=(--request-id "$SYNC_REQUEST_ID"); fi
          python -m pipeline.latest_night "${args[@]}"
      - name: Reconcile health history indexes with canonical R2 objects
        # Manual imports repair their own affected months; broad reconciliation
        # remains attached to the existing scheduled refresh.
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        run: python -m pipeline.health_history_index
